# Render's free plan. Secrets are not declared here: set them on each service in the
# dashboard. See docs/DEPLOY.md.
services:
  # Sealed invoices. Holds only encrypted blobs, and loses them on restart, which is fine:
  # each one is read seconds after upload.
  - type: web
    name: provingground-blobs
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build -w services/blobs
    startCommand: node services/blobs/dist/main.js
    healthCheckPath: /health
    autoDeployTrigger: commit

  # The arena's backend: the demo agent paying through the testnet vault.
  # Dashboard settings: AGENT_PRIVATE_KEY, NEAR_AI_API_KEY, BLOB_BASE_URL, WEB_ORIGIN.
  - type: web
    name: provingground-arena
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build -w packages/guard -w attacks -w agent -w services/arena
    startCommand: node services/arena/dist/main.js
    healthCheckPath: /health
    autoDeployTrigger: commit

  # The site. Dashboard setting, if the arena's address differs: VITE_ARENA_URL.
  - type: web
    name: provingground-web
    runtime: static
    buildCommand: npm ci --no-audit --no-fund && npm run build -w web
    staticPublishPath: ./web/dist
    autoDeployTrigger: commit
