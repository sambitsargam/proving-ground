<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-label="The Proving Ground vault: a dark cube with cobalt edges and a lime lock ring">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2130"/>
      <stop offset="1" stop-color="#11141D"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11141D"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D14"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="#05060A"/>
  <g opacity="0.85">
    <circle cx="96" cy="120" r="5" fill="#FF3D6E"/>
    <circle cx="560" cy="96" r="4" fill="#FF3D6E" opacity="0.7"/>
    <circle cx="586" cy="520" r="5" fill="#FF3D6E" opacity="0.8"/>
    <circle cx="70" cy="500" r="3.5" fill="#FF3D6E" opacity="0.6"/>
    <circle cx="300" cy="604" r="3" fill="#FF3D6E" opacity="0.5"/>
  </g>
  <path d="M320 110 L510 220 L320 330 L130 220 Z" fill="url(#top)"/>
  <path d="M130 220 L320 330 L320 550 L130 440 Z" fill="url(#left)"/>
  <path d="M320 330 L510 220 L510 440 L320 550 Z" fill="url(#right)"/>
  <g fill="none" stroke="#2F5BFF" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
    <path d="M320 110 L510 220 L510 440 L320 550 L130 440 L130 220 Z"/>
    <path d="M130 220 L320 330 L510 220 M320 330 L320 550"/>
  </g>
  <g transform="matrix(190 -110 0 220 320 330)" filter="url(#glow)">
    <circle cx="0.5" cy="0.5" r="0.2" fill="none" stroke="#C6FF1A" stroke-width="10" vector-effect="non-scaling-stroke"/>
    <circle cx="0.5" cy="0.5" r="0.055" fill="#C6FF1A"/>
  </g>
</svg>
